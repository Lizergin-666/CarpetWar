version: "3.9"

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: seawar-server
    env_file:
      - .env.prod
    environment:
      - PORT=4000
    restart: unless-stopped
    volumes:
      - ../server/data:/app/data

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    container_name: seawar-client
    env_file:
      - .env.prod
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - server
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: seawar-nginx
    depends_on:
      - client
      - server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
